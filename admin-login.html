<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-purple-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
      <h1 class="text-3xl font-bold text-center mb-6">Admin Login</h1>

      <input
        id="username"
        type="text"
        placeholder="Admin Username"
        class="w-full border p-2 rounded mb-4"
      />

      <input
        id="password"
        type="password"
        placeholder="Admin Password"
        class="w-full border p-2 rounded mb-4"
      />

      <button id="loginBtn" class="w-full bg-purple-600 text-white p-2 rounded">
        Login
      </button>

      <p id="message" class="text-red-500 text-center mt-4"></p>
    </div>

    <script src="admin-login.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-blue-100 flex justify-center items-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
      <h1 class="text-3xl font-bold text-center mb-6">Library Login</h1>

      <input
        type="text"
        id="username"
        placeholder="Username"
        class="w-full border p-2 rounded mb-4"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
        class="w-full border p-2 rounded mb-4"
      />

      <button
        id="loginBtn"
        class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600"
      >
        Login
      </button>

      <p class="text-center mt-4">
        Don't have an account?

        <a href="register.html" class="text-blue-500"> Register </a>
      </p>

      <p id="message" class="text-red-500 text-center mt-4"></p>
    </div>

    <script src="login.js"></script>
  </body>
</html>

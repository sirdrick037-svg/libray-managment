<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Admin Dashboard</title>

        <script src="https://cdn.tailwindcss.com"></script>
      </head>

      <body class="bg-gray-100">
        <div class="max-w-5xl mx-auto mt-10 bg-white p-8 rounded-lg shadow-lg">
        
          <h1 class="text-4xl font-bold text-center text-blue-600 mb-8">
            Admin Dashboard
          </h1>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-blue-500 text-white p-6 rounded-lg text-center">
              <h2 class="text-xl font-bold">Total Books</h2>
              <p id="totalBooks" class="text-4xl mt-4">0</p>
            </div>

            <div class="bg-green-500 text-white p-6 rounded-lg text-center">
              <h2 class="text-xl font-bold">Available</h2>
              <p id="availableBooks" class="text-4xl mt-4">0</p>
            </div>

            <div class="bg-red-500 text-white p-6 rounded-lg text-center">
              <h2 class="text-xl font-bold">Borrowed</h2>
              <p id="borrowedBooks" class="text-4xl mt-4">0</p>
            </div>
          </div>

          <div class="mt-8 bg-gray-100 p-6 rounded-lg">
            <h2 class="text-2xl font-bold mb-4">User Access Control</h2>

            <div class="flex items-center justify-between mb-4">
              <span class="font-semibold"> Allow User Registration </span>

              <button
                id="registrationBtn"
                class="bg-green-500 text-white px-4 py-2 rounded"
              >
                Enabled
              </button>
            </div>

            <div class="flex items-center justify-between">
              <span class="font-semibold"> Allow User Login </span>

              <button
                id="loginBtn"
                class="bg-green-500 text-white px-4 py-2 rounded"
              >
                Enabled
              </button>
            </div>
          </div>

          <div class="mt-10">
            <h2 class="text-2xl font-bold mb-4">Registered Users</h2>

            <table class="w-full border">
              <thead class="bg-blue-500 text-white">
                <tr>
                  <th class="p-3">Username</th>

                  <th class="p-3">Status</th>

                  <th class="p-3">Action</th>
                </tr>
              </thead>

              <tbody id="userTable"></tbody>
            </table>
          </div>

          <!-- Back to Library -->

          <div class="mt-8 text-center">
            <a href="index.html">
              <button
                class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600"
              >
                Back to Library
              </button>
            </a>
          </div>
        </div>
      </body>
    </html>
  </body>
</html>
